<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Badges — hasSy UI</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="demo-header">
  <p class="demo-kicker">hasSy UI · Component</p>
  <h1>Badges</h1>
  <p class="demo-hint">Pure CSS — copy <code>style.css</code> only. Status colors meet WCAG AA on light surfaces; variants are dark, orange, outline, success, danger, muted + <code>pill</code>.</p>
</header>

<div class="badge-showcase">
  <section class="badge-group">
    <h2>Status</h2>
    <div class="badge-row">
      <span class="badge dark">New</span>
      <span class="badge orange">Sale</span>
      <span class="badge outline">Limited</span>
      <span class="badge success">In Stock</span>
      <span class="badge danger">Sold Out</span>
      <span class="badge muted">Draft</span>
    </div>
  </section>

  <section class="badge-group">
    <h2>Pill</h2>
    <div class="badge-row">
      <span class="badge dark pill">Adventure</span>
      <span class="badge orange pill">-25% Off</span>
      <span class="badge outline pill">Free Shipping</span>
    </div>
  </section>
</div>

</body>
</html>
