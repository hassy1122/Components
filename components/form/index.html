<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Form — hasSy UI</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="demo-header">
  <p class="demo-kicker">hasSy UI · Component</p>
  <h1>Contact Form</h1>
  <p class="demo-hint">Copy <code>style.css</code> + <code>script.js</code>. Native validation plus a styled success state — submit to try it.</p>
</header>

<div class="form-wrap">
  <form class="styled-form" id="contactForm" novalidate>
    <h2>Get in Touch</h2>
    <p class="form-subtext">We'll get back to you within 24 hours.</p>

    <div class="form-group">
      <label for="name">Full Name</label>
      <input type="text" id="name" name="name" placeholder="Your name" required autocomplete="name">
    </div>

    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email">
    </div>

    <div class="form-group">
      <label for="subject">Subject</label>
      <select id="subject" name="subject">
        <option>General Inquiry</option>
        <option>Booking Question</option>
        <option>Support</option>
        <option>Other</option>
      </select>
    </div>

    <div class="form-group">
      <label for="message">Message</label>
      <textarea id="message" name="message" rows="5" placeholder="Write your message..." required></textarea>
    </div>

    <div class="form-group checkbox-group">
      <input type="checkbox" id="agree" required>
      <label for="agree">I agree to be contacted about this inquiry</label>
    </div>

    <p class="form-error" id="formError" role="alert"></p>

    <button type="submit" class="orange-btn full-width">Send Message</button>
    <p class="form-success" id="formSuccess" role="status">Thanks — your message has been sent.</p>
  </form>
</div>

<script src="script.js"></script>
</body>
</html>
